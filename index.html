<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-8eiKGiFRan9LOir+cc10asI9A7suPVuFAbavaNwe9M8='; style-src 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF2F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rounds">
<title>TIMPEX Rounds Update</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D6B63'/%3E%3Cpath d='M14 22h36' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M32 22v26' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M38 42l5 5 9-11' stroke='%23F4CF45' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#EEF2F0;--sf:#FFFFFF;--sf2:#F6F8F7;--ink:#17211E;--mut:#56645F;--ln:#D3DBD8;
  --pri:#1D6B63;--pri-ink:#FFFFFF;--pri-soft:#E1EFEC;
  --hl:#F4CF45;--hl-ink:#3B3000;--hl-soft:#FCEFAE;
  --bad:#B3361F;--bad-soft:#FBE5E0;--warn:#875700;--warn-soft:#FFF2D4;
  --r:14px;--shadow:0 1px 0 rgba(23,33,30,.05);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0E1412;--sf:#161E1C;--sf2:#1C2623;--ink:#E3EAE7;--mut:#94A39E;--ln:#2B3734;
  --pri:#4FB2A6;--pri-ink:#04201C;--pri-soft:#173029;
  --hl:#E8C547;--hl-ink:#2A2200;--hl-soft:#43391A;
  --bad:#F08B76;--bad-soft:#3B201A;--warn:#F1C46A;--warn-soft:#342A15;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--stick,64px) + 16px);scroll-padding-bottom:100px;overscroll-behavior-y:contain}
body{overscroll-behavior-y:contain;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-ligatures:no-contextual;font-feature-settings:"calt" 0;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.modal{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:4px 12px 24px}
body[data-view=patient] .wrap{padding-bottom:120px}
a{color:var(--pri)}
code{font-size:.9em;background:var(--sf2);border:1px solid var(--ln);border-radius:6px;padding:0 4px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln)}
.bar-in{max-width:680px;margin:0 auto;width:100%;display:flex;align-items:center;gap:6px}
.bar-t{flex:1;min-width:0}
.bar-t b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t small{display:block;color:var(--mut);font-size:13px}
.brand{flex:1;font-size:18px;letter-spacing:.01em;padding-left:6px}
.brand b{font-weight:800;letter-spacing:.06em;color:var(--pri)}
.ib{flex:none;min-width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:none;border-radius:12px;color:var(--ink);text-decoration:none;padding:0}
.ib svg{width:24px;height:24px}
.ib:active{background:var(--pri-soft)}

/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--ln))}
.btn.dangerf{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.add{margin-top:10px}
.lnk{background:none;border:0;padding:10px 6px;color:var(--pri);font-weight:600;font-size:15px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.badge:not(:empty){min-width:22px;min-height:22px;padding:0 6px;border-radius:11px;background:var(--hl);color:var(--hl-ink);font-size:13px;font-weight:700;display:inline-grid;place-items:center}

/* home */
.pts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.pt{display:grid;gap:2px;padding:14px 16px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);color:var(--ink);text-decoration:none;box-shadow:var(--shadow);border-left:5px solid var(--pri)}
.pt-n{font-weight:700;font-size:17px}
.pt-m{color:var(--ink);font-size:15px}
.pt-s{color:var(--mut);font-size:13px}
.pt-s.stale{color:var(--warn);font-weight:600}
.pt-s.sent{color:var(--pri)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 10px}
.backup{display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:28px 18px;text-align:center;color:var(--mut);background:var(--sf);border:1.5px dashed var(--ln);border-radius:var(--r);margin:14px 0}
.empty p{margin:4px 0}
.empty p:first-child{color:var(--ink);font-weight:700;font-size:17px}
.note{color:var(--mut);font-size:13px;margin:14px 2px}
.hint{color:var(--mut);font-size:13px;margin:8px 0}

/* cards */
.tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin:4px 0 -2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);margin:10px 0;box-shadow:var(--shadow);overflow:clip;contain:layout style;scroll-margin-top:calc(var(--stick,64px) + 8px)}
.card.open{border-top:4px solid var(--pri)}
.card-h{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border:0;background:none;text-align:left}
.card-t{font-weight:700;font-size:17px;flex:1;min-width:0}
.card-s{color:var(--mut);font-size:13px;text-align:right;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-s.empty{color:var(--warn);font-weight:600}
.chev{flex:none;width:12px;height:12px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:-6px 4px 0 2px;transition:transform .15s}
.open .chev{transform:rotate(-135deg);margin-top:6px}
.card-b:not(:empty){padding:2px 14px 16px}
.card.plain{border-top:1px solid var(--ln)}
.sub{font-size:15px;font-weight:700;margin:18px 0 8px}
.card-b>.sub:first-child{margin-top:6px}

/* fields */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid+.grid,.grid+.fld,.fld+.grid,.card-b>.fld+.fld{margin-top:10px}
.span2{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.lb{font-size:13px;color:var(--mut);font-weight:600;line-height:1.25}
.lb i{font-style:normal;font-weight:500;opacity:.85}
.in{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf2);font-size:16px;min-width:0}
textarea.in{min-height:76px;resize:vertical;line-height:1.4}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.in:focus{outline:none;border-color:var(--pri);background:var(--sf)}
.in.flag{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
input[type=date].in{min-height:48px}
.pair{display:flex;align-items:center;gap:6px}
.pair .in{flex:1}
.ro{min-height:48px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--sf2);border:1.5px dashed var(--ln);color:var(--mut)}
.calc{margin:10px 0 0;color:var(--mut);font-size:14px;white-space:pre-line}
.calc:empty{display:none}
.calc.big{color:var(--pri);font-weight:700;font-size:16px}
.calc.pre{background:var(--sf2);border-radius:10px;padding:10px 12px;color:var(--ink)}
.tog{display:flex;align-items:center;gap:12px;min-height:48px;margin-top:8px;font-size:15px}
.tog input{width:22px;height:22px;accent-color:var(--pri);flex:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;min-height:44px;padding:9px 15px;border:1.5px solid var(--ln);border-radius:22px;background:var(--sf);font-size:15px;line-height:1.3;text-align:left;display:inline-flex;align-items:center;gap:6px}
.chip.on,.chip.cbx:has(input:checked){background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip.cbx input{position:absolute;opacity:0;pointer-events:none}
.chip.cbx{position:relative;cursor:pointer}
.chip.cbx:has(input:focus-visible){outline:2.5px solid var(--pri);outline-offset:2px}
.auto{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:9px;background:var(--pri-soft);color:var(--pri);vertical-align:middle}
.chip.on .auto{background:rgba(255,255,255,.22);color:inherit}
.chiprow{flex-basis:100%;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px 6px 6px;border-radius:16px;background:var(--pri-soft);border:1.5px solid var(--pri)}
.tick{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri);color:var(--pri-ink);border:0;display:grid;place-items:center;padding:0}
.tick svg{width:20px;height:20px}
.tx{flex:1 1 9em;min-width:0;font-size:15px;line-height:1.35;padding:6px 0}
.tx .isel,.tx .iinp{vertical-align:middle;margin:2px 0}
.tx .auto{margin-left:6px}
.tx .tok{font-weight:700}
.isel,.iinp,.trend{min-height:44px;padding:4px 8px;border:1.5px solid color-mix(in srgb,var(--pri) 55%,var(--ln));border-radius:9px;background:var(--sf);font-size:16px;max-width:100%}
.iinp{width:auto;min-width:5em;max-width:100%}.iinp.n{min-width:3.5em}
.ctl{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-left:auto;align-self:flex-start;max-width:100%}
.trend{color:var(--mut);width:100px}
.trend:has(option:checked:not([value=""])){color:var(--ink);font-weight:600}
.star{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);font-size:21px;line-height:1;color:var(--mut);padding:0}
.star.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.chiprow.starred .tx>span:not(.tok){background:linear-gradient(transparent 52%,var(--hl-soft) 52%,var(--hl-soft) 92%,transparent 92%)}
.say{flex-basis:100%;font-size:13px;color:var(--mut);padding:0 4px 2px 52px}
.say:empty{display:none}
.chip-edit{margin-top:2px}

/* row logs */
.rows .row{display:grid;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--ln)}
.rows .row:first-child{padding-top:2px}
.row .rate{grid-column:1/-1;order:9;font-size:14px;color:var(--pri);font-weight:700}
.row .rate:empty{display:none}
.del{color:var(--mut);align-self:end;height:48px}
.del svg{width:20px;height:20px}
.r-void{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}
.r-ivf{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 44px}
.r-bp{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 44px}
.r-cbg{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px 44px}
.r-cbg>:nth-child(3){order:8;grid-column:1/-1}
.r-cbg .star{align-self:end;height:48px}
.r-ctr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}
.r-ctr>:nth-child(3){order:5;grid-column:1/3}
.r-ctr>:nth-child(4){order:4}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.drip{padding:12px;border:1.5px solid var(--ln);border-radius:12px;margin:10px 0;background:var(--sf2)}
.drip .in{background-color:var(--sf)}
.drip-f{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.drip-f>:first-child{min-width:0}
.drip-f .calc{margin:6px 0 0}
.nih{margin-top:16px;padding-top:4px;border-top:4px solid var(--ln)}
.nih-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.nih-h .calc{margin:0}
.nih .fld{margin-top:10px}

/* meds */
.meds{list-style:none;margin:0;padding:0}
.med{border-bottom:1px solid var(--ln);background:var(--sf)}
.med.drag{background:var(--pri-soft);box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:2;border-radius:10px}
.med-h{display:flex;align-items:center;gap:2px}
.grip{flex:none;width:40px;height:52px;display:grid;place-items:center;color:var(--mut);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grip svg{width:18px;height:18px}
.med-l{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 4px;min-height:52px;font-size:15px;line-height:1.35}
.med.st-hold .med-l{color:var(--warn)}
.med.st-dc .med-l{color:var(--mut);text-decoration:line-through}
.med-e{padding:4px 4px 14px 42px}
.flags{margin-top:10px}

/* chip editor */
.ce{list-style:none;padding:0;margin:12px 0}
.ce-i{display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--ln);background:var(--bg)}
.ce-i.drag{background:var(--pri-soft);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:2}
.ce-b{flex:1;min-width:0}
.ce-b textarea.in{min-height:56px}
.ce-o{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:4px}
.ce-o .tog{margin:0;font-size:14px}
.help p{font-size:14px;color:var(--mut);margin:8px 0}
.grp{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--ln);text-decoration:none;color:var(--ink);padding:0 2px}
.grp span{color:var(--mut);font-size:14px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--ln);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.dock-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:8px}
.dock .btn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dock .btn{min-height:52px}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,18,15,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out;padding-bottom:var(--kb,0px)}
.sheet{background:var(--sf);width:100%;max-width:680px;max-height:92vh;max-height:calc(92dvh - var(--kb,0px));overflow:auto;border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-12px;background:var(--sf);padding:6px 0;z-index:1}
.sh-h h2,.ask-t{font-size:19px;margin:6px 0}
.sh-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--sf);padding:10px 0 4px}
.sh-f .btn{flex:1;min-width:120px}
.sheet p{margin:8px 0}
pre.msg{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;white-space:pre-wrap;word-break:break-word;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:8px 0 0;user-select:text;-webkit-user-select:text}
.warns{background:var(--warn-soft);border-left:5px solid var(--warn);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:14px}
.warns ul,.wl{margin:6px 0;padding-left:0;list-style:none}
.warns li,.wl li{margin:2px 0}
.warns button,.wl button{background:none;border:0;padding:6px 0;text-align:left;color:var(--ink);font-size:14px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--warn) 50%,transparent);text-underline-offset:3px}
.warns small{color:var(--mut)}
.okmsg{color:var(--pri);font-weight:600;font-size:14px;margin:6px 0 4px}
.menu{display:flex;flex-direction:column}
.mi{display:grid;gap:2px;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:14px 4px;min-height:56px}
.mi b{font-size:16px}
.mi span{font-size:13px;color:var(--mut)}
.mi.danger b{color:var(--bad)}
.secs .tog{border-bottom:1px solid var(--ln);margin:0;min-height:52px}
.hi{display:grid;gap:2px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:10px 0}
.hi span{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:70;max-width:min(92vw,560px);font-size:15px;transition:opacity .18s,transform .18s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
body:not([data-view=patient]) .toast{bottom:calc(20px + env(safe-area-inset-bottom))}

@media (min-width:560px){.r-cbg{grid-template-columns:minmax(0,.9fr) minmax(0,.8fr) minmax(0,1.6fr) 44px 44px}.r-cbg>:nth-child(3){order:0;grid-column:auto}}
@media (max-width:370px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* added: undo toasts, patient reordering, hide the bottom bar while typing */
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:6px 8px 6px 16px}
.tbtn{background:none;border:0;color:var(--hl);font-weight:800;font-size:15px;min-height:40px;padding:0 10px;border-radius:8px}
[data-theme=dark] .tbtn{color:#7a5d00}
.pt-w{display:flex;align-items:stretch;gap:2px}
.pt-w .pt{flex:1;min-width:0}
.pt-w .grip{height:auto;min-height:52px}
.pt-w.drag .pt{background:var(--pri-soft);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.pt-w.drag{position:relative;z-index:2}
@media (pointer:coarse){body.typing .dock{display:none}}

/* added: lock screen, banners, level 2 CBG flag */
.lockv{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.lock-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.lock-ico{width:64px;height:64px;margin:0 auto 4px;border-radius:18px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.lock-ico svg{width:32px;height:32px}
.lock-in h1{font-size:20px;font-weight:500;margin:4px 0 0}
.lock-in h1 b{font-weight:800;letter-spacing:.06em;color:var(--pri)}
.lock-in p{margin:0;color:var(--mut)}
.in.pin{text-align:center;font-size:22px;letter-spacing:.3em;min-height:56px}
.lock-in .lnk{align-self:center}

.btn:active,.chip:active,.tick:active,.star:active,.jp:active,.ib:active,.mi:active,.now:active{transform:scale(.96);filter:brightness(.93)}

@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.02)}100%{transform:scale(1)}}

.jp{flex:none;min-height:44px;padding:0 3px;border:0;background:none;color:var(--ink);display:flex;align-items:center}

.jp.empty span::after{content:"";position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.jp:active{transform:none;filter:none}.jp:active span{filter:brightness(.93)}
.card.open>.card-h{position:sticky;top:var(--stick,64px);z-index:4;background:var(--sf);border-bottom:1px solid var(--ln)}

.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:2px auto 6px;touch-action:none}
.sheet .sh-h,.sheet .ask-t{touch-action:none}
@keyframes down{to{transform:translateY(105%)}}
@keyframes fadeout{to{opacity:0}}
.sheet-bg.closing{animation:fadeout .17s ease-in forwards;pointer-events:none}
.sheet-bg.closing .sheet{animation:down .17s cubic-bezier(.4,0,1,1) forwards}
::view-transition-old(root){animation:90ms ease-in both fadeout}
::view-transition-new(root){animation:160ms cubic-bezier(.2,.8,.2,1) both vt-in}

/* after the font shorthand above, so it is not reset: show "->" exactly as it will be sent */

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

<body>
<div id="app"></div>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<datalist id="dl-ivf"><option>PNSS</option><option>PLR</option><option>D5W</option><option>D5LR</option><option>D5NM</option><option>D5 0.3% NaCl</option><option>D5 0.45% NaCl</option><option>0.45% NaCl</option></datalist>
<datalist id="dl-freq"><option>OD</option><option>BID</option><option>TID</option><option>QID</option><option>q4h</option><option>q6h</option><option>q8h</option><option>q12h</option><option>q24h</option><option>HS</option><option>PRN</option></datalist>
<datalist id="dl-route"><option>IV</option><option>PO</option><option>per NGT</option><option>SC</option><option>IM</option><option>SL</option><option>via nebulizer</option><option>topical</option></datalist>
<datalist id="dl-mv"><option>AC-VC</option><option>AC-PC</option><option>SIMV</option><option>PSV</option><option>CPAP</option></datalist>
<noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
<script>
/* ================= TIMPEX Rounds Update: core logic (no DOM) ================= */
'use strict';
const APP_KEY = 'timpex-rounds-v1';
const HIST_MAX = 30; // saved messages kept per patient
const DIVIDER = '━'.repeat(18);

/* ---------- small helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const clone = o => JSON.parse(JSON.stringify(o));
const str = v => (v == null ? '' : String(v)).trim();
const num = v => { const s = str(v).replace(',', '.'); if (!s) return NaN; const n = Number(s); return Number.isFinite(n) ? n : parseFloat(s); };
const ok = n => typeof n === 'number' && Number.isFinite(n);
const fx = (n, d = 2) => { const f = 10 ** d; let s = (Math.round(n * f) / f).toFixed(d); if (d > 0) s = s.replace(/\.?0+$/, ''); return s === '-0' ? '0' : s; };
const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
const signed = n => (n > 0 ? '+' : '') + fx(n, 2);
// Names that keep their capital letter mid-sentence ("..., Foley catheter inserted").
const KEEP_CAP = /^(Foley|Bristol|Babinski|Kernig|Brudzinski|Murphy|McBurney|Rovsing|Kussmaul|Cheyne|Glasgow|Romberg|Trousseau|Chvostek|Homans|Levine|Hoffmann|Cullen|Grey|Blumberg|Kehr|Austin|Graham|Gallavardin|Hamman|Kussmaul)\b/;
const lc1 = s => (s && s.length > 1 && /[a-z]/.test(s[1]) && !KEEP_CAP.test(s) ? s[0].toLowerCase() + s.slice(1) : s);
const cap1 = s => (s ? s[0].toUpperCase() + s.slice(1) : s);
const rng = (a, b) => { a = str(a); b = str(b); return a && b ? a + '-' + b : a || b; };

/* ---------- dates ---------- */
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const todayISO = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const isoDay = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const addDays = (s, n) => { const d = new Date((isoDay(s) + n) * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const dayDiff = (a, b) => isoDay(b) - isoDay(a);
const counterDay = (start, base, on) => (isISO(start) && isISO(on) ? dayDiff(start, on) + (Number(base) === 0 ? 0 : 1) : null);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDate = s => { if (!isISO(s)) return s || ''; const [y, m, d] = s.split('-').map(Number); const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return `${WDAYS[w]}, ${MONTHS[m - 1]} ${d}`; };

/* ---------- times (stored as "HH:MM", 24 h) ---------- */
function normTime(raw) {
  let s = str(raw).toLowerCase();
  if (!s) return '';
  const pm = /p/.test(s), am = /a/.test(s) || /mn/.test(s);
  s = s.replace(/[^0-9:.]/g, '').replace('.', ':');
  if (!s.replace(':', '')) return '';
  let h, m;
  if (s.includes(':')) { const [a, b = ''] = s.split(':'); if (b.length > 2 || !a) return ''; h = +a; m = +(b || 0); }
  else if (s.length <= 2) { h = +s; m = 0; }
  else if (s.length === 3) { h = +s[0]; m = +s.slice(1); }
  else if (s.length === 4) { h = +s.slice(0, 2); m = +s.slice(2); }
  else return '';
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (!(h >= 0 && h < 24 && m >= 0 && m < 60)) return '';
  return pad(h) + ':' + pad(m);
}
const tmin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
function fmtTime(s) {
  const t = tmin(s);
  if (t == null) return s || '';
  let h = Math.floor(t / 60); const mm = t % 60, ap = h < 12 ? 'am' : 'pm';
  h = h % 12 || 12;
  return h + (mm ? ':' + pad(mm) : '') + ' ' + ap;
}
const minsBetween = (a, b) => { const d = (b - a + 1440) % 1440; return d || null; };

/* ---------- chip templates ---------- */
// [a/b/c] dropdown   [__] or [label] text blank   [#] number blank   {token} value from another section
function parseTpl(t) {
  const parts = [], re = /\[([^\]]*)\]|\{([a-z0-9_]+)\}/gi;
  let m, last = 0, fi = 0;
  t = t || '';
  while ((m = re.exec(t))) {
    if (m.index > last) parts.push({ k: 'txt', s: t.slice(last, m.index) });
    if (m[1] != null) {
      const inner = m[1];
      if (inner.includes('/') && !inner.startsWith('#')) parts.push({ k: 'sel', o: inner.split('/').map(x => x.trim()), i: fi++ });
      else parts.push({ k: 'inp', ph: inner.replace(/^#/, '').trim() || (inner.startsWith('#') ? '#' : '__'), n: inner.startsWith('#'), i: fi++ });
    } else parts.push({ k: 'tok', name: m[2].toLowerCase() });
    last = re.lastIndex;
  }
  if (last < t.length) parts.push({ k: 'txt', s: t.slice(last) });
  return parts;
}
function fillTpl(t, vals, ctx) {
  return parseTpl(t).map(p => {
    if (p.k === 'txt') return p.s;
    const v = vals ? vals[p.i] : undefined;
    if (p.k === 'sel') return v != null && p.o.includes(v) ? v : p.o[0];
    if (p.k === 'inp') return str(v) || '__';
    const tv = ctx ? ctx.tok(p.name) : '';
    return tv === '' || tv == null ? '__' : String(tv);
  }).join('').replace(/\s+/g, ' ').trim();
}
const chipLabel = t => parseTpl(t).map(p => (p.k === 'txt' ? p.s : p.k === 'sel' ? p.o[0] : p.k === 'inp' ? '__' : '…')).join('').replace(/\s+/g, ' ').trim();
const tplHasFields = t => parseTpl(t).some(p => p.k !== 'txt');

const TRENDS = ['Still', 'Improved', 'Worsened', 'New', 'Resolved'];
const NO_WITH = /^(with|on|in|no|not|nor|able|unable|afebrile|febrile|for|under|off|npo|being|awake|asleep|drowsy|still|soft|tolerat\w*|hav\w*|receiv\w*|requir\w*|intubated|alert|conversant|coherent|oriented|without|at|seen|patient|noted|denies|dependent|follows)\b/i;
// Which trend tags fit a chip. 'none': the phrase already carries it ("Still on vasopressor", "Improved verbal output").
// 'still': a normal finding that can only persist. Anything that starts with a negation ("No dyspnea") also takes only "Still".
const CHIP_TREND = {
  gs_seen: 'none', gs_verbal: 'none', gs_vaso: 'none', gs_uo: 'none', ne_words: 'none', cv_cvp: 'none', ab_shape: 'none', re_foley: 'none', re_nofoley: 'none', he_tx: 'none',
  gs_conv: 'still', gs_afeb: 'still', ne_conv: 'still', ne_coh: 'still', ne_cmd: 'still', pu_sym: 'still', pu_clear: 'still', cv_adyn: 'still', cv_pulse: 'still', cv_crt: 'still', ab_soft: 'still', ab_bs: 'still', he_ac: 'still',
};
const NEG_START = /^(no|not|nor|denies|without|negative|afebrile)\b|^non-/i;
function trendsFor(def, text) {
  const k = def.tr || CHIP_TREND[def.id];
  if (k === 'none') return [];
  if (k === 'still' || NEG_START.test(text || '')) return ['Still'];
  return TRENDS;
}
// The values a chip prints with. Episodes of brady/tachycardia follow the HR range until you pick one yourself.
function chipVals(def, st, ctx) {
  const v = st && st.v && typeof st.v === 'object' ? Object.assign([], st.v) : [];
  if (def.id === 'gs_hr' && v[0] == null && ctx) {
    const m = /^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/.exec(String(ctx.tok('hr_range') || ''));
    if (m && +m[1] >= 60 && +m[2] > 100) v[0] = 'tachycardia';
  }
  return v;
}
function applyTrend(text, tr) {
  if (!tr || !text) return text;
  if (tr === 'Still') return NO_WITH.test(text) ? 'Still ' + lc1(text) : 'Still with ' + lc1(text);
  return tr + ' ' + lc1(text.replace(/^with\s+/i, ''));
}
// segments {text, join} -> bullet lines. Joined chips continue the previous line with a comma.
function joinSegs(segs) {
  const lines = [];
  for (const s of segs) {
    const t = s.text;
    if (!t) continue;
    if (s.join && lines.length) {
      const L = lines[lines.length - 1], last = L[L.length - 1];
      const a = /^no (.+) episodes$/i.exec(last), b = /^no (.+) episodes$/i.exec(t);
      if (a && b) L[L.length - 1] = last.replace(/ episodes$/i, '') + ' nor ' + b[1] + ' episodes';
      else L.push(lc1(t));
    } else lines.push([t]);
  }
  return lines.map(L => cap1(L.join(', ')));
}

/* ---------- defaults ---------- */
const DEF_SETTINGS = {
  greeting: 'Good {time}, Doctors. Respectfully updating you regarding your patient:',
  showNormals: true,
  closing: 'Thank you, Doctors.',
  signName: '[SURNAME], IDH',
  fever: '38.0', feverIcu: '38.3', cbgLow: '70', cbgLow2: '54', cbgHigh: '180', uoLow: '0.5', uoHigh: '1.5',
  theme: 'auto', haptics: true, reqLabel: 'For your input:', initialsNew: false, retainDays: '7', lockMins: '5',
};

const GROUPS = {
  gs: { name: 'General survey', sec: 'gs', trend: 1 },
  urine: { name: 'Urine appearance', sec: 'fluid', inline: 1 },
  resp: { name: 'Respiratory support', sec: 'resp', trend: 1, star: 1 },
  neuro: { name: 'Neurologic', sec: 'neuro', trend: 1, star: 1 },
  pulm: { name: 'Pulmonary', sec: 'pulm', trend: 1, star: 1 },
  cv: { name: 'Cardiovascular', sec: 'cv', trend: 1, star: 1 },
  abd: { name: 'Abdomen', sec: 'gi', trend: 1, star: 1 },
  diet: { name: 'Diet', sec: 'gi', inline: 1 },
  bm: { name: 'Bowel movement', sec: 'gi', inline: 1 },
  renal: { name: 'Renal / Fluid status', sec: 'renal', trend: 1, star: 1 },
  heme: { name: 'Hematology', sec: 'heme', trend: 1, star: 1 },
  pend: { name: 'Pending', sec: 'pend', inline: 1, keep: 1 },
  req: { name: 'Requests', sec: 'ar' },
};

// [id, template, joins previous line?, auto]
const DEF_CHIPS_RAW = {
  gs: [
    ['gs_seen', 'Patient seen [asleep/awake]'],
    ['gs_distress', 'Not in cardiopulmonary distress', 1],
    ['gs_access', 'No use of accessory muscles', 1],
    ['gs_conv', 'Able to converse', 1],
    ['gs_verbal', 'Improved verbal output compared to [__]'],
    ['gs_hr', 'With episodes of [bradycardia/tachycardia] (HR range: {hr_range})'],
    ['gs_hypo', 'No hypotensive episodes'],
    ['gs_desat', 'No desaturation episodes', 1],
    ['gs_vaso', 'Still on vasopressor', 1, 'vaso'],
    ['gs_afeb', 'Afebrile'],
    ['gs_uo', 'Urine output [non-concentrated/concentrated/straw-colored/amber/tea-colored], {uo_goal}'],
  ],
  urine: [['ua_straw', 'straw-colored'], ['ua_amber', 'amber'], ['ua_tea', 'tea-colored'], ['ua_nonconc', 'non-concentrated'], ['ua_conc', 'concentrated'], ['ua_cloudy', 'cloudy'], ['ua_sed', 'with sediments'], ['ua_hema', 'gross hematuria']],
  resp: [['rs_nodesat', 'No episodes of desaturation']],
  neuro: [['ne_conv', 'Conversant', 1], ['ne_coh', 'Coherent', 1], ['ne_words', 'More words exhibited', 1], ['ne_cmd', 'Follows commands', 1], ['ne_ha', 'No headache'], ['ne_sz', 'No seizures', 1]],
  pulm: [
    ['pu_sym', 'Symmetric chest expansion'],

  if (c.uoWin.r12 != null && c.uoWin.r12 < 0.5) return { stage: 2, t: `Urine output over the last 12H of the void log is ${f2(c.uoWin.r12)} ml/kg/hr, under 0.5 (KDIGO AKI stage 2 urine criterion).` };

const INSULIN_RE = /insulin|glargine|detemir|degludec|lispro|aspart|glulisine|\bnph\b|humulin|novorapid|novomix|lantus|levemir|tresiba|apidra|humalog/i;

function calc(p, S) {

  c.kdigo = kdigoFlag(c);
  c.onInsulin = !!str(r.en.insulin) || r.drips.some(d => d.drug === 'Insulin' && num(d.rate) > 0) || live.some(m => m.st === 'active' && INSULIN_RE.test(m.g + ' ' + m.b));
  return c;
}

function mkCtx(p, c) {
  const v = p.rec.v;
  const T = {
    hr_range: () => rng(v.hrLo, v.hrHi),
    bp_range: () => { const s = rng(v.sbpLo, v.sbpHi), d = rng(v.dbpLo, v.dbpHi); return s && d ? s + '/' + d : s || d; },
    spo2_range: () => { const x = rng(v.spo2Lo, v.spo2Hi); return x ? x + '%' : ''; },
    temp: () => str(v.t), tmax: () => str(v.tmax),
    weight: () => (str(p.weight) ? str(p.weight) + 'kg' : ''),
    map: () => (c.map == null ? '' : c.map), gcs: () => (c.gcs ? c.gcs.txt : ''),
    uo_rate: () => (c.uoRate == null ? '' : f2(c.uoRate) + 'ml/kg/hr'),
    uo_goal: () => c.uoGoal, net24: () => (c.net24 == null ? '' : signed(c.net24)),
    uo_6h: () => (c.uoWin.r6 == null ? '' : f2(c.uoWin.r6) + 'ml/kg/hr'),
    cbg_range: () => c.cbgRange, anticoag: () => c.acText,
  };

}
const TOKENS = ['hr_range', 'bp_range', 'spo2_range', 'temp', 'tmax', 'weight', 'map', 'gcs', 'uo_rate', 'uo_goal', 'uo_6h', 'net24', 'cbg_range', 'anticoag'];

function chipDefs(db, g) { return (db.chips && db.chips[g]) || defChips(g); }
const chipState = (r, g, id) => (r.chips[g] || {})[id] || null;

  return !!(st && st.on);
}
const chipPhrase = (def, st, ctx) => { const text = fillTpl(def.t, chipVals(def, st, ctx), ctx), tr = (st && st.tr) || ''; return tr && trendsFor(def, text).includes(tr) ? applyTrend(text, tr) : text; };
function ticked(db, r, g, ctx) {

    const st = chipState(r, g, d.id) || {};

const inlineList = (segs, keep) => segs.map((s, i) => (i && !keep ? lc1(s.text) : s.text)).join(', ');
const othLines = (r, k) => str(r.oth[k]).split('\n').map(x => x.trim().replace(/^[>•]+\s*/, '')).filter(Boolean);
const bul = a => a.map(x => '>' + x);
function sec(title, gap, blocks) {
  blocks = blocks.filter(b => (Array.isArray(b) ? b.length : b)).map(b => (Array.isArray(b) ? b.join('\n') : b));

/* ---------- message ---------- */
function buildMessage(p, db, now = new Date()) {
  const S = db.settings, r = p.rec, c = calc(p, S), ctx = mkCtx(p, c), v = r.v, fl = r.fl;
  const on = k => !!p.on[k];
  const T = g => ticked(db, r, g, ctx);
  const out = {};

  /* General survey */
  out.gs = (() => {
    const lines = joinSegs(T('gs')).concat(othLines(r, 'gs'));

    for (const g of Object.keys(GROUPS)) {
      const G = GROUPS[g];

    const b1 = [];

    const b2 = [];

      const h = str(fl.shHrs), pre = h ? h + '-hour' : 'Shift';
      b2.push((str(fl.shLabel) || 'Shift') + ':');
      if (str(fl.shIn)) b2.push(`${pre} Input: ${str(fl.shIn)}`);
      if (str(fl.shOut)) b2.push(`${pre} Output: ${str(fl.shOut)}`);
      if (c.netSh != null) b2.push('Net balance: ' + signed(c.netSh));
    }

    if (str(fl.urine)) bd.push('Urine: ' + str(fl.urine) + (fl.uoLine && c.uoRate != null ? ` (${f2(c.uoRate)}ml/kg/hr, ${c.uoGoal})` : ''));

    });

    if (str(v.rr)) b1.push(`RR: ${str(v.rr)}/min`);
    if (str(v.sbp) || str(v.dbp)) b1.push(`BP: ${str(v.sbp) || '__'}/${str(v.dbp) || '__'}`);
    if (c.map != null) b1.push('MAP: ' + c.map);

      if (rl.length) b2.push('24H ranges:', ...rl);

  })();

  /* Neurologic */
  out.neuro = (() => {
    const ne = r.ne;

    if (c.gcs) L.push('GCS: ' + c.gcs.txt);

    return sec('RENAL / FLUID STATUS', false, [bul(L.concat(joinSegs(T('renal')), othLines(r, 'renal')))]);

  out.endo = (() => {
    const en = r.en, f = CBG_FREQ.find(x => x[0] === en.freq);

function chipItem(g, d, ctx) {
  const r = curP().rec, G = GROUPS[g];
  const st = chipState(r, g, d.id) || {}, on = isOn(d, st, ctx), key = `${g}:${esc(d.id)}`;
  const auto = d.a ? ` data-auto="${key}" data-on="${on ? 1 : 0}"` : '';
  const tag = d.a ? `<i class="auto">${typeof st.manual === 'boolean' ? 'set by you' : 'auto'}</i>` : '';
  const expand = on && (G.trend || G.star || tplHasFields(d.t));
  if (!expand) return `<button type="button" class="chip${on ? ' on' : ''}" data-chip="${key}" data-act="chip" data-g="${g}" data-id="${esc(d.id)}" aria-pressed="${on}"${auto}>${esc(chipLabel(d.t))}${tag}</button>`;
  const base = `r.chips.${g}.${esc(d.id)}`, ev = chipVals(d, st, ctx);
  const allowed = G.trend ? trendsFor(d, fillTpl(d.t, ev, ctx)) : [];
  const tx = parseTpl(d.t).map(pt => {
    if (pt.k === 'txt') return `<span>${esc(pt.s)}</span>`;
    if (pt.k === 'sel') { const cur = pt.o.includes(ev[pt.i]) ? ev[pt.i] : pt.o[0]; return `<select class="isel" data-b="${base}.v.${pt.i}" aria-label="Choose">${pt.o.map(o => `<option${o === cur ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`; }
    if (pt.k === 'inp') { const val = st.v && st.v[pt.i] != null ? st.v[pt.i] : ''; return `<input class="iinp${pt.n ? ' n' : ''}" type="text"${pt.n ? ' inputmode="decimal"' : ' autocorrect="off" spellcheck="false"'} enterkeyhint="next" size="${Math.max(pt.n ? 3 : 6, String(val).length + 1)}" autocomplete="off" data-b="${base}.v.${pt.i}" value="${esc(val)}" placeholder="${esc(pt.ph)}" aria-label="${esc(pt.ph)}">`; }
    return `<span class="tok" data-c="tok:${pt.name}"></span>`;
  }).join('');
  const ctl = (allowed.length ? `<select class="trend" data-b="${base}.tr" aria-label="Trend">${['', ...allowed].map(t => `<option value="${t}"${(st.tr || '') === t ? ' selected' : ''}>${t || 'Trend'}</option>`).join('')}</select>` : '')
    + (G.star ? `<button type="button" class="star${st.star ? ' on' : ''}" data-act="star" data-g="${g}" data-id="${esc(d.id)}" aria-pressed="${!!st.star}" aria-label="Also show in General Survey">${st.star ? '★' : '☆'}</button>` : '');
  return `<div class="chiprow${st.star ? ' starred' : ''}" data-chip="${key}"${auto}><button type="button" class="tick" data-act="chip" data-g="${g}" data-id="${esc(d.id)}" aria-label="Untick">${ICON.check}</button><div class="tx">${tx}${tag}</div>${ctl ? `<div class="ctl">${ctl}</div>` : ''}${G.trend ? `<div class="say" data-c="chip:${key}"></div>` : ''}</div>`;
}
function chipsHtml(g) {
  const p = curP(), ctx = mkCtx(p, calc(p, db.settings));

// Redraws one chip in place: much less layout work than redrawing the whole card, and the page doesn't jump.
function updateChip(g, id, pop) {
  const p = curP(), d = chipDefs(db, g).find(x => x.id === id); if (!d) return;
  const ctx = mkCtx(p, calc(p, db.settings));
  $$(`[data-chip="${g}:${id}"]`).forEach(el => {
    const had = el.contains(document.activeElement), tmp = document.createElement('div');

    if (had) { const f = n.matches('button') ? n : $('.tick', n); if (f) f.focus({ preventScroll: true }); }

  refresh();
}

// keepState: a new sheet is about to open, so keep the shared history entry instead of going back.
const closeSheets = keepState => liveSheets().forEach(b => closeSheet(b, false, false, keepState));

  const sh = $('.sheet', all[all.length - 1]);
  const f = $$('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])', sh).filter(x => !x.disabled && x.getClientRects().length);

// Drag a sheet down by its handle or title to close it.

      <div class="sh-f">${cancel ? `<button type="button" class="btn" data-ask="no">${esc(cancel)}</button>` : ''}${alt ? `<button type="button" class="btn" data-ask="alt">${esc(alt)}</button>` : ''}<button type="button" class="btn ${danger ? 'dangerf' : 'pri'}" data-ask="ok">${esc(ok)}</button></div>`, 'ask', () => res(false));

/* ---------- preview, copy, share ---------- */
const warnList = ws => ws.map(w => `<li><button type="button" data-act="goto" data-k="${w.k}">${esc(w.t)}</button></li>`).join('');

    <div data-pv="warn"></div><div data-pv="parts"></div><div data-pv="chg"></div><pre class="msg" data-pv="msg"></pre>
    <div class="sh-f"><button type="button" class="btn pri" data-act="pcopy">Copy</button><button type="button" class="btn" data-act="pshare">Share</button></div>`, 'preview');

// Short vibration on Android when the setting is on; iPhone browsers have no vibration API, so this does nothing there.

}

/* ---------- data ---------- */
function b64e(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

const canCrypt = () => !!(window.crypto && crypto.subtle && window.isSecureContext);
async function deriveKey(pass, salt, iter) {

}
async function encryptJSON(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pass, salt, iter), new TextEncoder().encode(JSON.stringify(obj)));
  return { app: 'timpex-rounds', v: 1, enc: 'AES-GCM-256', kdf: 'PBKDF2-SHA256', iter, salt: b64e(salt), iv: b64e(iv), data: b64e(new Uint8Array(ct)) };
}
async function decryptJSON(env, pass) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(env.iv) }, await deriveKey(pass, b64d(env.salt), env.iter), b64d(env.data));

function saveFile(text, name) {
  db.meta.lastBackup = Date.now(); db.meta.dismiss.backup = 0; flush();
  if (ui.view === 'home' || ui.view === 'settings') setTimeout(() => { $('#app').innerHTML = VIEWS[ui.view](); }, 0);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function exportJSON() {
  flush();
  const name = `timpex-rounds-backup-${todayISO()}`;
  if (!canCrypt()) { saveFile(JSON.stringify(db, null, 1), name + '.json'); toast('Backup saved (unencrypted: encryption needs the https address). It contains patient data, so keep it private.', 6000); return; }
  const v = await ask({
    title: 'Export backup', body: 'Set a passphrase to encrypt the file (recommended, since it holds patient data). You’ll need the passphrase to import it, and it can’t be recovered. Leave both blank to save without encryption.',
    fields: [{ label: 'Passphrase', type: 'password' }, { label: 'Type it again', type: 'password' }], ok: 'Export',
    onOk: x => { if (!x[0] && !x[1]) saveFile(JSON.stringify(db, null, 1), name + '.json'); },
  });
  if (v === false) return;
  if (!v[0] && !v[1]) { toast('Backup saved without encryption. It contains patient data, so keep it private.', 5000); return; }
  if (v[0] !== v[1]) { toast('The two passphrases don’t match. Nothing was exported.', 4500); return; }
  if (v[0].length < 6) { toast('Use a passphrase of at least 6 characters. Nothing was exported.', 4500); return; }
  toast('Encrypting…', 1500);
  const env = await encryptJSON(db, v[0]);
  await ask({ title: 'Encrypted backup ready', body: 'Save the file, and keep the passphrase somewhere safe.', ok: 'Save file', cancel: '', onOk: () => saveFile(JSON.stringify(env), name + '-encrypted.json') });
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('That file couldn’t be read as a backup (it isn’t valid JSON).', 4500); return; }
  if (data && data.enc && data.data) {
    if (!canCrypt()) { toast('This backup is encrypted. Open the app from its https address to import it.', 5000); return; }
    const iter = +data.iter;
    if (!(iter >= 1000 && iter <= 5e6) || !data.salt || !data.iv) { toast('This encrypted backup looks damaged.', 4500); return; }
    const v = await ask({ title: 'Encrypted backup', body: 'Enter the passphrase you set when you exported it.', fields: [{ label: 'Passphrase', type: 'password' }], ok: 'Unlock' });
    if (v === false) return;
    try { data = await decryptJSON(data, v[0]); } catch (e) { toast('Wrong passphrase, or the file is damaged. Nothing was imported.', 5000); return; }
  }
  if (!data || !Array.isArray(data.patients)) { toast('That file isn’t a TIMPEX Rounds backup: it has no patient list.', 4500); return; }
  const n = data.patients.length;
  const res = await ask({ title: `Import ${n} patient${n === 1 ? '' : 's'}?`, body: 'Replace swaps everything on this phone (patients, chips and settings) for the backup. Merge adds the backup’s patients and keeps yours; a patient that is in both is replaced by the backup copy.', ok: 'Replace all', alt: 'Merge', danger: true });
  if (!res) return;
  const inc = normDB(data);
  if (res === 'alt') inc.patients.forEach(np => { const i = db.patients.findIndex(x => x.id === np.id); if (i >= 0) db.patients[i] = np; else db.patients.push(np); });
  else db = inc;
  flush(); applyTheme(); go('#/'); toast(`Imported ${n} patient${n === 1 ? '' : 's'}.`);
}
$('#imp').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
async function doClearAll() {
  const v = await ask({ title: 'Clear all data?', body: 'This deletes every patient, all history, your custom chips and your settings from this phone. It can\u2019t be undone. Export a backup first if you might need any of it.', fields: [{ label: 'Type DELETE to confirm', cap: 'characters' }], ok: 'Clear all data', danger: true });
  if (v === false) return;
  if (v[0] !== 'DELETE') { toast('Nothing was deleted. Type DELETE in capitals to confirm.', 4000); return; }
  try { localStorage.removeItem(APP_KEY); localStorage.removeItem(UI_KEY); } catch (e) { /* ignore */ }
  db = freshDB(); ui.open = {}; flush(); applyTheme(); go('#/'); toast('All data cleared.');
}

/* ---------- events ---------- */

    else o.value = val == null ? '' : val;
  });
}
function readEl(el) {
